name: Specialist training smoke
on:
  pull_request:
    paths: ['training/**','data/**','src/**','scripts/**','.github/workflows/specialists.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python training/dataset.py --out runs
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python training/train.py --steps 2 --batch 2 --out runs
      - run: node scripts/benchmark.mjs runs
      - run: python training/train.py --profile six --steps 2 --batch 2 --out runs/six
      - run: node scripts/benchmark.mjs runs/six
      - run: python training/train.py --profile nine --steps 2 --batch 2 --out runs/nine
      - run: node scripts/benchmark.mjs runs/nine
      - run: node scripts/composition-benchmark.mjs runs/nine
      - run: node scripts/cluster-benchmark.mjs runs/nine shared-nine
      - run: node scripts/recursive-benchmark.mjs runs/nine
      - run: node scripts/elastic-benchmark.mjs runs/nine
      - run: python training/train_gears.py --out runs/gears --base-steps 2 --steps 2 --batch 2
      - run: node scripts/gear-benchmark.mjs runs/gears
      - run: python training/train_layer_gears.py --out runs/layers --base-steps 2 --steps 2 --batch 2
      - run: node scripts/layer-benchmark.mjs runs/layers
      - run: python training/train_nested_gears.py --out runs/nested --base-steps 2 --steps 2 --batch 2
      - run: node scripts/nested-benchmark.mjs runs/nested
      - uses: actions/upload-artifact@v4
        with:
          name: specialist-smoke-results
          path: |
            runs/manifest.json
            runs/benchmark.json
            runs/train.json
            runs/test.json
            runs/six/manifest.json
            runs/six/benchmark.json
            runs/six/train.json
            runs/six/test.json
            runs/nine/manifest.json
            runs/nine/benchmark.json
            runs/nine/composition.json
            runs/nine/cluster-benchmark.json
            runs/nine/recursive-benchmark.json
            runs/nine/elastic-benchmark.json
            runs/nine/elastic/snapshot.json
            runs/gears/manifest.json
            runs/gears/gear-benchmark.json
            runs/layers/manifest.json
            runs/layers/layer-benchmark.json
            runs/nested/manifest.json
            runs/nested/nested-benchmark.json
            runs/nine/train.json
            runs/nine/test.json
